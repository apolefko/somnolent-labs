name: Rebuild content manifest

on:
  push:
    branches: [main]
    paths:
      - 'md/**'
      - 'development/md/**'
      - 'research/md/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the generator can derive dates from git

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build manifest, feeds, and sitemap
        run: node scripts/build-manifest.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No content changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manifest.json sitemap.xml index.xml development/index.xml research/index.xml
          git commit -m "Rebuild content manifest"
          git push
