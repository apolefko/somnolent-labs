<head>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body class="dark text-light">
<main>
  <div class="container pt-5">
    <div class="row mt-5 pt-5">
      <nav aria-label="breadcrumb" class="small">
        <ol class="breadcrumb fw-bold">
          <li class="breadcrumb-item"><a href="/">home</a></li>
          <li class="breadcrumb-item"><a href="/development">development</a></li>
          <li class="breadcrumb-item"><a href="/research" class="text-decoration-underline link-offset-3">research</a></li>
          <li class="breadcrumb-item"><a href="/posts">posts</a></li>
          <li class="breadcrumb-item"><a href="https://github.com/apolefko" target="_blank" rel="noopener noreferrer">github</a></li>
        </ol>
      </nav>
    </div>

    <h2 class="text-uppercase mb-4">Research</h2>
    <div id="items-list"><p class="text-muted">Coming soon.</p></div>
  </div>
</main>

<script>
  function formatDate(str) {
    const d = new Date(str.includes('T') ? str : str + 'T00:00:00');
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  function renderItems(items) {
    if (!items.length) return;
    const sorted = items.slice().sort((a, b) => (b.sortDate || b.date || '').localeCompare(a.sortDate || a.date || ''));
    document.getElementById('items-list').innerHTML = sorted.map(item => `
      <div class="mb-5">
        ${item.date ? `<time datetime="${item.date}" class="text-muted small">${formatDate(item.date)}</time>` : ''}
        <h4 class="text-uppercase">${item.title}</h4>
        <div>${marked.parse(item.content)}</div>
      </div>
    `).join('');
  }

  fetch('https://api.github.com/repos/apolefko/somnolent-labs/contents/research/md')
    .then(r => r.ok ? r.json() : [])
    .then(files => {
      if (!Array.isArray(files)) return;
      return Promise.all(
        files.filter(f => f.name.endsWith('.md')).map(f =>
          Promise.all([
            fetch(`https://raw.githubusercontent.com/apolefko/somnolent-labs/main/research/md/${f.name}`)
              .then(r => r.text()),
            fetch(`https://api.github.com/repos/apolefko/somnolent-labs/commits?path=research/md/${f.name}&per_page=1`)
              .then(r => r.ok ? r.json() : [])
          ]).then(([text, commits]) => {
            const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n([\s\S]*)$/);
            if (!m) return { title: f.name.replace('.md',''), content: text, date: null, sortDate: null };
            const meta = {};
            m[1].split('\n').forEach(line => {
              const idx = line.indexOf(':');
              if (idx > -1) meta[line.slice(0,idx).trim()] = line.slice(idx+1).trim();
            });
            const commitDate = commits.length ? commits[0].commit.author.date : null;
            return { title: meta.title || f.name.replace('.md',''), date: meta.date || null, sortDate: commitDate, content: m[2] };
          })
        )
      );
    })
    .then(mdItems => { if (mdItems) renderItems(mdItems); })
    .catch(() => {});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
