<!DOCTYPE html>
<html lang="en-us" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="shortcut icon" type="image/png" href="https://somnolentlabs.com/favicon.ico" />
<title>Somnolent Labs</title>
<link rel="stylesheet" href="/css/main.min.4524882f5d1196622ca104ab1aad53fdc14a51b37d18dd767cbe40cde6310feb.css" integrity="sha256-RSSIL10RlmIsoQSrGq1T/cFKUbN9GN12fL5AzeYxD+s=" crossorigin="anonymous">
<link rel="stylesheet" href="/css/palette/catpuccin.min.e2839e7c321b1899e8f752c4744a0d53a16a68d46c4cbccc7f4e41f6ef6d2667.css" integrity="sha256-4oOefDIbGJno91LEdEoNU6FqaNRsTLzMf05B9u9tJmc=" crossorigin="anonymous">
<script src="/js/main.86bb3d8e6f46df0fc97c2731e6b99175a13b87a4086acf578ff9b6992fcf32c1.js" integrity="sha256-hrs9jm9G3w/JfCcx5rmRdaE7h6QIas9Xj/m2mS/PMsE=" crossorigin="anonymous"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body class="dark text-light">
<main>
  <div class="container pt-5">
    <div class="row mt-5 pt-5">
      <nav aria-label="breadcrumb" class="small">
        <ol class="breadcrumb fw-bold">
          <li class="breadcrumb-item"><a href="/">home</a></li>
          <li class="breadcrumb-item"><a href="/development">development</a></li>
          <li class="breadcrumb-item"><a href="/research">research</a></li>
          <li class="breadcrumb-item"><a href="/posts" class="text-decoration-underline link-offset-3">posts</a></li>
          <li class="breadcrumb-item"><a href="https://github.com/apolefko" target="_blank" rel="noopener noreferrer">github</a></li>
        </ol>
      </nav>
    </div>

    <div class="post">
      <header class="mb-5">
        <h1 class="text-uppercase" id="post-title">Loading…</h1>
        <div aria-label="breadcrumb">
          <ol class="breadcrumb">
            <li class="breadcrumb-item small"><time id="post-date"></time></li>
          </ol>
        </div>
      </header>
      <article id="post-content"></article>
    </div>
  </div>
</main>

<script>
  function parseFrontmatter(text) {
    const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n([\s\S]*)$/);
    if (!m) return { meta: {}, content: text };
    const meta = {};
    m[1].split('\n').forEach(line => {
      const idx = line.indexOf(':');
      if (idx > -1) meta[line.slice(0, idx).trim()] = line.slice(idx + 1).trim();
    });
    return { meta, content: m[2] };
  }

  function formatDate(str) {
    const d = new Date(str + 'T00:00:00');
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  const slug = new URLSearchParams(location.search).get('slug');
  if (slug) {
    fetch(`https://raw.githubusercontent.com/apolefko/somnolent-labs/main/md/${slug}.md`)
      .then(r => { if (!r.ok) throw new Error('not found'); return r.text(); })
      .then(text => {
        const { meta, content } = parseFrontmatter(text);
        const title = meta.title || slug.replace(/^\d{4}-\d{2}-\d{2}-/, '').replace(/-/g, ' ');
        document.title = `Somnolent Labs | ${title}`;
        document.getElementById('post-title').textContent = title;
        if (meta.date) {
          document.getElementById('post-date').textContent = formatDate(meta.date);
          document.getElementById('post-date').setAttribute('datetime', meta.date);
        }
        document.getElementById('post-content').innerHTML = marked.parse(content);
      })
      .catch(() => {
        document.getElementById('post-title').textContent = 'Post not found';
        document.getElementById('post-content').innerHTML = '<p><a href="/posts">← back to posts</a></p>';
      });
  } else {
    location.href = '/posts';
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
