<body class="dark text-light">
<main>
  <div class="container pt-5">
    <div class="row mt-5 pt-5">
      <nav aria-label="breadcrumb" class="small">
        <ol class="breadcrumb fw-bold">
          <li class="breadcrumb-item"><a href="/">home</a></li>
          <li class="breadcrumb-item"><a href="/development">development</a></li>
          <li class="breadcrumb-item"><a href="/research">research</a></li>
          <li class="breadcrumb-item"><a href="/posts" class="text-decoration-underline link-offset-3">posts</a></li>
          <li class="breadcrumb-item"><a href="https://github.com/apolefko" target="_blank" rel="noopener noreferrer">github</a></li>
        </ol>
      </nav>
    </div>

    <div id="posts-list"></div>
  </div>
</main>

<script>
  const legacy = [
    { title: "Dbl Check - Relaunch", date: "2025-06-02", url: "/posts/dblcheckrelaunch/" },
    { title: "Currently working a lot with my buddy Claude", date: "2025-03-19", url: "/posts/let-us-cook/" },
    { title: "Welcome To Somnolent Labs", date: "2025-03-08", url: "/posts/first-post/" },
  ];

  function formatDate(str) {
    const d = new Date(str + 'T00:00:00');
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  function renderPosts(posts) {
    const sorted = posts.slice().sort((a, b) => b.date.localeCompare(a.date));
    document.getElementById('posts-list').innerHTML = sorted.map(p => `
      <div class="row mb-3">
        <time datetime="${p.date}">${formatDate(p.date)}</time>
        <h2 class="h5"><a href="${p.url}">${p.title}</a></h2>
      </div>
    `).join('');
  }

  renderPosts(legacy);

  fetch('https://api.github.com/repos/apolefko/somnolent-labs/contents/md')
    .then(r => r.ok ? r.json() : [])
    .then(files => {
      if (!Array.isArray(files)) return;
      const mdFiles = files.filter(f => f.name.endsWith('.md'));
      return Promise.all(mdFiles.map(f =>
        fetch(`https://raw.githubusercontent.com/apolefko/somnolent-labs/main/md/${f.name}`)
          .then(r => r.text())
          .then(text => {
            const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n/);
            const meta = {};
            if (m) m[1].split('\n').forEach(line => {
              const idx = line.indexOf(':');
              if (idx > -1) meta[line.slice(0, idx).trim()] = line.slice(idx + 1).trim();
            });
            const slug = f.name.replace('.md', '');
            return {
              title: meta.title || slug.replace(/^\d{4}-\d{2}-\d{2}-/, '').replace(/-/g, ' '),
              date: meta.date || slug.slice(0, 10),
              url: `/posts/post.html?slug=${slug}`,
            };
          })
      ));
    })
    .then(mdPosts => {
      if (mdPosts && mdPosts.length) renderPosts([...legacy, ...mdPosts]);
    })
    .catch(() => {});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
